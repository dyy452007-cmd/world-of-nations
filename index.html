.zone.selected{fill:rgba(255,214,110,.24);stroke:#ffd66e;stroke-width:3}.zone.claimed{fill:var(--claim,#b7d7e5);fill-opacity:.48;stroke:#eaf5fa;stroke-opacity:.85;stroke-width:1.5}.zone.pending{fill:#f1d38b;fill-opacity:.55;stroke:#fff1c4;stroke-opacity:.9}.ocean-label{fill:#c5d8d9;font-size:9px;letter-spacing:3px;opacity:.7}.side-stack{display:grid;gap:16px;align-content:start}.muted{color:var(--muted)}.big{font-size:23px;font-weight:700}.status{display:inline-block;padding:3px 8px;border-radius:99px;font-size:12px;background:#263d50;color:#d7e5ed}.status.ok{color:#a4f0c7;background:#1e473b}.status.wait{color:#ffe5a0;background:#4b4025}.status.no{color:#ffb9b9;background:#4b292d}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:13px;color:var(--muted)}input,textarea,select{width:100%;background:#091521;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}textarea{min-height:76px;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.section{display:none}.section.active{display:block}.nation-card,.item{padding:12px;border:1px solid var(--line);border-radius:12px;background:#102032;margin:8px 0}.nation-head{display:flex;gap:10px;align-items:center}.flag{width:44px;height:29px;object-fit:cover;border:1px solid #607485;background:#fff}.small{font-size:12px}.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.notice{background:#172f40;border-left:3px solid var(--blue);padding:10px 12px;border-radius:7px;color:#c8dce8;font-size:13px;margin:10px 0}.footer{margin:18px 0;color:var(--muted);font-size:12px;text-align:center}.hidden{display:none!important}
.upload-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px;background:#091521;border:1px solid var(--line);border-radius:10px;min-height:58px}
.upload-input{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
